          # Accept all licenses non-interactively
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          
          # Install exactly what the project needs
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmdline-tools;latest"
          
          # Verify
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la $ANDROID_HOME/platforms/ || true
          ls -la $ANDROID_HOME/build-tools/ || true

      # ------------------------------------------------------------------
      # local.properties (fixes "SDK location not found")
      # ------------------------------------------------------------------
      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      # ------------------------------------------------------------------
      # Gradle wrapper – make sure it exists and is executable
      # ------------------------------------------------------------------
      - name: Ensure Gradle wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew missing – generating wrapper"
            gradle wrapper --gradle-version 8.9
          fi
          # Fix line endings + permissions (common source of "Permission denied")
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew --version

      # ------------------------------------------------------------------
      # Build
      # ------------------------------------------------------------------
      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tee build-debug.log
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Build Release APK (unsigned)
        run: |
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build-release.log || true
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # ------------------------------------------------------------------
      # Collect artifacts even if one build fails
      # ------------------------------------------------------------------
      - name: Prepare output package
        if: always()
        run: |
          mkdir -p out_package
          
          # Copy any APK that was produced
          find app/build/outputs/apk -name "*.apk" -exec cp -v {} out_package/ \; 2>/dev/null || true
          
          # Also copy logs for debugging
          cp -v build-*.log out_package/ 2>/dev/null || true
          
          {
            echo "HyperLauncher V2 – Build GitHub Actions"
            echo "Date     : $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo "Commit   : ${{ github.sha }}"
            echo "Runner   : ${{ runner.os }}"
            echo ""
            echo "APKs generated:"
            ls -lh out_package/*.apk 2>/dev/null || echo "  (aucun APK trouvé)"
          } > out_package/README.txt
          
          cd out_package && zip -r ../HyperLauncher_Release.zip . || true

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HyperLauncher-APK
          path: |
            out_package/*.apk
            out_package/*.log
            out_package/README.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload full package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HyperLauncher_Release
          path: HyperLauncher_Release.zip
          if-no-files-found: warn
          retention-days: 14
